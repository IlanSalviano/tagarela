name: Tagarela
options:
  bundleIdPrefix: com.tagarela
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: pt-BR
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  xcodeVersion: "15.4"

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_OBJC_ARC: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Tagarela:
    type: application
    platform: macOS
    sources:
      - path: Tagarela
        excludes:
          - "Resources/Info.plist"
          - "Resources/Tagarela.entitlements"
    resources:
      - path: Tagarela/Resources/Assets.xcassets
      - path: Tagarela/Resources/Fonts
      - path: Tagarela/Localization
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tagarela.Tagarela
        INFOPLIST_FILE: Tagarela/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tagarela/Resources/Tagarela.entitlements
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  TagarelaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TagarelaTests
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tagarela.TagarelaTests
        INFOPLIST_FILE: TagarelaTests/Info.plist
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tagarela.app/Contents/MacOS/Tagarela"
    dependencies:
      - target: Tagarela

schemes:
  Tagarela:
    build:
      targets:
        Tagarela: all
        TagarelaTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TagarelaTests
    archive:
      config: Release
